<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Open position</title>
</head>
<body>
<h1>Select instrument and size for an open position</h1>

<form th:action="@{/open_position}" th:object="${param}" method="post">
    <select th:field="*{instrument}">
        <option value="EUR_USD">EUR_USD</option>
        <option value="USD_CHF">USD_CHF</option>
        <option value="GBP_USD">GBP_USD</option>
        <option value="USD_JPY">USD_JPY</option>
    </select>

    <input type="number"
           th:field="*{units}"
           min="-100"
           max="100"
           required>

    <input type="submit" value="Submit">
</form>

<p>Positive units open a long position; negative units open a short position.</p>
</body>
</html>
