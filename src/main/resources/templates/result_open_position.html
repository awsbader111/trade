<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" th:href="@{/css/site.css}">
    <meta charset="UTF-8">
    <title>Position opened</title>
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="content">
    <h1 th:text="${error != null} ? 'Trade not opened' : 'Position opened'">
        Trade result
    </h1>

<p th:text="'Instrument: ' + ${instr}"></p>
<p th:text="'Units: ' + ${units}"></p>
<p class="alert" th:if="${error}" th:text="${error}"></p>
<p th:if="${id}" th:text="${id}"></p>

<a th:href="@{/open_position}">Open another position</a>
<br>
<a th:href="@{/positions}">View open positions</a>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
