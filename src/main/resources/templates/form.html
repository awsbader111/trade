<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exchange rates</title>
</head>
<body>
<h1>Get exchange rates</h1>

<form th:action="@{/exercise}" th:object="${param}" method="post">
    <label for="currency">Currency:</label>
    <select id="currency" th:field="*{currency}">
        <option value="EUR">EUR</option>
        <option value="USD">USD</option>
        <option value="GBP">GBP</option>
        <option value="CHF">CHF</option>
    </select>

    <br><br>

    <label for="startDate">Start date:</label>
    <input id="startDate" type="date" th:field="*{startDate}" required>

    <br><br>

    <label for="endDate">End date:</label>
    <input id="endDate" type="date" th:field="*{endDate}" required>

    <br><br>

    <button type="submit">Get rates</button>
</form>
</body>
</html>
