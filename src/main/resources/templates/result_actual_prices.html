<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actual Prices</title><link rel="stylesheet" th:href="@{/css/site.css}"></head>
<body><header th:replace="~{fragments :: header}"></header><main class="content">
<h1>Actual Forex Prices</h1><p>Instrument: <strong th:text="${instr}"></strong></p>
<p class="alert" th:if="${error}" th:text="${error}"></p>
<div class="table-wrap" th:if="${quotes != null and !#lists.isEmpty(quotes)}"><table><thead><tr><th>Instrument</th><th>Time (UTC)</th><th>Best Bid</th><th>Best Ask</th></tr></thead><tbody><tr th:each="q : ${quotes}"><td th:text="${q.instrument}"></td><td th:text="${q.time}"></td><td th:text="${q.bid}"></td><td th:text="${q.ask}"></td></tr></tbody></table></div>
<p><a th:href="@{/actual_prices}">Select another instrument</a></p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
