<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Close Practice Trade</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="content"><h1>Close Practice Trade</h1>
    <p class="alert" th:if="${error}" th:text="${error}"></p>
    <p th:if="${tradeId}" th:text="${tradeId}"></p>
    <p><a th:href="@{/positions}">View Open Positions</a></p>
    <p><a th:href="@{/close_position}">Return to Close Trade</a></p></main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
