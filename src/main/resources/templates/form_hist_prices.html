<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historical prices</title>
</head>
<body>
<h1>Select instrument and granularity for historical prices</h1>

<form th:action="@{/hist_prices}" th:object="${param}" method="post">
    <select th:field="*{instrument}">
        <option value="EUR_USD">EUR_USD</option>
        <option value="USD_CHF">USD_CHF</option>
        <option value="GBP_USD">GBP_USD</option>
        <option value="USD_JPY">USD_JPY</option>
    </select>

    <select th:field="*{granularity}">
        <option value="M1">M1</option>
        <option value="H1">H1</option>
        <option value="D">D</option>
        <option value="W">W</option>
        <option value="M">M</option>
    </select>

    <input type="submit" value="Submit">
</form>
</body>
</html>
