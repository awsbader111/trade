<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select instrument</title>
</head>
<body>
<h1>Select instrument</h1>

<form th:action="@{/actual_prices}" th:object="${par}" method="post">
    <select th:field="*{instrument}">
        <option value="EUR_USD">EUR_USD</option>
        <option value="USD_CHF">USD_CHF</option>
        <option value="GBP_USD">GBP_USD</option>
        <option value="USD_JPY">USD_JPY</option>
    </select>

    <input type="submit" value="Submit">
</form>
</body>
</html>
