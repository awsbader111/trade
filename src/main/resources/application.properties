spring.application.name=trade
# File-backed H2 database; creates C:/data/atlasfx.mv.db on Windows.
# Override the URL with ATLASFX_DB_URL for non-Windows development.
spring.datasource.url=${ATLASFX_DB_URL:jdbc:h2:file:C:/data/atlasfx;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
